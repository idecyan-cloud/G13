<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Group 13 Findings</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@600;800&family=IBM+Plex+Sans+KR:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
:root{--bg:#f6f7f9;--surface:#fff;--ink:#14171c;--ink-2:#4a5160;--ink-3:#7a8191;--rule:#dfe3ea;--accent:#1f5fae;--accent-soft:#e6eef8;
--display:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--body:"IBM Plex Sans KR","Apple SD Gothic Neo",sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121418;--surface:#1a1d23;--ink:#eef0f4;--ink-2:#b9bfcb;--ink-3:#8b92a1;--rule:#2c313b;--accent:#7fb0ef;--accent-soft:#1d2a3c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121418;--surface:#1a1d23;--ink:#eef0f4;--ink-2:#b9bfcb;--ink-3:#8b92a1;--rule:#2c313b;--accent:#7fb0ef;--accent-soft:#1d2a3c;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);padding-inline:16px;line-height:1.6}
.wrap{max-width:640px;margin:0 auto;padding-block:64px;display:grid;gap:22px}
.eyebrow{font-family:var(--mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,5vw,2.3rem);line-height:1.25;margin:0;text-wrap:balance}
p{margin:0;color:var(--ink-2)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
a.choice{display:grid;gap:4px;padding:18px 20px;border:1px solid var(--rule);border-radius:10px;background:var(--surface);color:var(--ink);text-decoration:none}
a.choice:hover,a.choice:focus-visible{border-color:var(--accent);background:var(--accent-soft);outline:none}
a.choice b{font-family:var(--display);font-size:1.15rem}
a.choice span{font-size:.85rem;color:var(--ink-3)}
</style>
<div class="wrap">
  <div class="eyebrow">Group 13 · Week 5</div>
  <h1>Do shoppers who view more product pages buy more?<br>상품 페이지를 많이 보면 더 많이 살까?</h1>

  </div>
</div>
